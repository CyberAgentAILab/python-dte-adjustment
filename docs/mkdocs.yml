site_name: dte_adj
site_description: A Python package for estimating distribution treatment effects
site_url: https://cyberagentailab.github.io/python-dte-adjustment/
repo_url: https://github.com/CyberAgentAILab/python-dte-adjustment
repo_name: CyberAgentAILab/python-dte-adjustment
copyright: Copyright &copy; 2024 CyberAgent, Inc.

docs_dir: docs
site_dir: build/html

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Installation: installation.md
  - Get Started: get_started.md
  - Tutorials:
      - tutorials/index.md
      - Hillstrom: tutorials/hillstrom.md
      - Oregon: tutorials/oregon.md
  - API Reference:
      - api/index.md
      - Simple Randomization: api/simple.md
      - Covariate Adaptive Randomization: api/stratified.md
      - Local Distribution: api/local.md
      - Plotting: api/plot.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [..]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: false
            show_root_toc_entry: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            docstring_section_style: table
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CyberAgentAILab/python-dte-adjustment
